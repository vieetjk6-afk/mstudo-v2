[package]
name = "mstudo-desktop"
version = "1.1.3"
description = "MStudo Desktop — tự động lưu hợp đồng & sao lưu dữ liệu studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
tauri-plugin-single-instance = "2.4.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
