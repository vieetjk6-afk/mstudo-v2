# BỘ HẸN GIỜ QUÉT KHUÔN MẶT — chạy từ GitHub, không phụ thuộc gói Vercel.
#
# Vì sao có file này. Cron của Vercel KHÔNG chạy trên project này: đo suốt 10
# phút không một con số nào nhúc nhích, kể cả dấu `faces_clustered_at` mà mọi
# lượt cron thành công đều để lại. Gói Hobby chỉ cho 2 cron và mỗi ngày một
# lần, trong khi vercel.json khai 8 cái — nhiều khả năng là vậy, nhưng dù lý do
# là gì thì kết luận không đổi: không thể dựa vào nó.
#
# GitHub Actions thì miễn phí, chạy độc lập với gói Vercel, và gọi đúng cái
# route mà Vercel cron lẽ ra phải gọi. Không thêm một dòng code chạy nào vào
# app — chỉ là một cái đồng hồ khác bấm chuông.
#
# CẦN MỘT LẦN THIẾT LẬP: GitHub → repo → Settings → Secrets and variables →
# Actions → New repository secret, tên `CRON_SECRET`, giá trị GIỐNG HỆT biến
# CRON_SECRET đang có trên Vercel. Thiếu nó thì app trả 401 và workflow báo đỏ.
#
# Lưu ý về lịch: GitHub chạy cron kiểu "sớm nhất có thể", thường trễ vài phút
# lúc cao điểm — không sao, đây là việc chạy nền.
name: Quét khuôn mặt

on:
  schedule:
    - cron: "*/10 * * * *"
  # Bấm chạy tay được ở tab Actions, không phải đợi tới giờ.
  workflow_dispatch:

# Không để hai lượt chồng nhau: hai tiến trình cùng quét một album là tốn CPU
# đôi mà không nhanh hơn — chúng giành nhau đúng những tấm ảnh đó.
concurrency:
  group: quet-khuon-mat
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    # Một lượt GitHub gọi app NHIỀU LẦN liên tiếp, vì mỗi lượt gọi chỉ quét được
    # ~30 ảnh (hạn 45 giây của hàm serverless). Gọi 8 lần ≈ 7 phút, vẫn gọn
    # trong khoảng 10 phút giữa hai lần hẹn giờ.
    timeout-minutes: 12
    steps:
      - name: Gọi bộ quét nhiều lượt
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
          BASE: ${{ vars.SITE_URL || 'https://mstudo.com' }}
        run: |
          set -u
          if [ -z "${SECRET}" ]; then
            echo "::error::Thiếu secret CRON_SECRET. Thêm ở Settings → Secrets and variables → Actions."
            exit 1
          fi
          for i in $(seq 1 8); do
            echo "── lượt $i ──"
            ma=$(curl -sS -o /tmp/ra.json -w '%{http_code}' --max-time 90 \
                 -H "Authorization: Bearer ${SECRET}" \
                 "${BASE}/api/cron/face-scan" || echo "000")
            if [ "${ma}" = "401" ]; then
              echo "::error::App trả 401 — CRON_SECRET ở GitHub khác với trên Vercel."
              exit 1
            fi
            if [ "${ma}" != "200" ]; then
              # `|| true` KHÔNG phải đề phòng suông — thiếu nó là mất đúng câu
              # chẩn đoán, đúng lúc cần nhất. jq 1.7 thoát mã 5 khi thân không
              # phải JSON (trang lỗi HTML của Vercel, hoặc rỗng vì curl hết giờ),
              # và với `bash -e` thì một phép GÁN từ lệnh hỏng kết thúc script
              # ngay tại dòng này — trước cả dòng ::error:: bên dưới. Đó là cách
              # lượt 05:12 ngày 10/09 báo đỏ với đúng một chữ "exit code 5" và
              # không một manh mối nào: chế độ hỏng tệ nhất lại là chế độ duy
              # nhất không nói được gì.
              ly_do=$(jq -r '[.error, .hint] | map(select(.)) | join(" · ")' /tmp/ra.json 2>/dev/null || true)
              echo "::error::App trả ${ma}. ${ly_do:-thân không phải JSON — gần như chắc là trang lỗi của Vercel, không phải của app}"
              exit 1
            fi
            # 200 mà thân không phải JSON thì mọi câu jq bên dưới đều thoát 5 và
            # giết script không lời giải thích (xem trên). Chốt một lần ở đây.
            if ! jq -e . /tmp/ra.json >/dev/null 2>&1; then
              echo "::error::App trả 200 nhưng thân không phải JSON — gần như chắc là trang lỗi/chuyển hướng của Vercel."
              exit 1
            fi
            # ── LOG CÔNG KHAI — repo này public, ai cũng đọc được log Actions ──
            # Nên chỉ in NHỊP ĐỘ (quét bao nhiêu, ghi có ăn không), TUYỆT ĐỐI
            # không in id album, số ảnh còn tồn hay tổng ảnh mỗi album: đó là số
            # liệu kinh doanh (studio có bao nhiêu album, mỗi album bao nhiêu
            # ảnh), không phải thứ cần cho việc chẩn đoán từ xa.
            #
            # Số liệu đầy đủ vẫn xem được — sau khi ĐĂNG NHẬP, ở /api/face-status:
            # từng album, còn bao nhiêu ảnh chưa quét, tìm được bao nhiêu khuôn
            # mặt, gom thành mấy người.
            #
            # `hàng đợi N quét / M gom` là SỐ ALBUM trong hàng đợi lượt này, chặn
            # trên bởi MAX_ALBUMS = 3. Nó qua được hàng rào riêng tư ở trên (không
            # nói studio có bao nhiêu album, cũng không nói album nào bao nhiêu
            # ảnh) và nó là thứ duy nhất tách được BA trạng thái mà bản trước in
            # ra y hệt nhau — cả ba đều là "quét 0 ảnh":
            #   0 quét / 0 gom  → hết việc thật
            #   N quét / 0 gom  → tìm ra album cần quét mà không quét nổi tấm nào
            #   0 quét / M gom  → đang gom mãi những album không có khuôn mặt
            # Ba chuyện đó cần ba cách sửa khác nhau.
            # `lỗi tải` và câu lỗi mẫu là thứ tách được BA nguyên nhân của "quét 0
            # ảnh" mà log cũ in ra y hệt nhau: Drive từ chối tải, trọng số mô hình
            # không đi theo gói triển khai, hay hàng đợi và vòng quét lệch định
            # nghĩa "còn phải quét". Câu lỗi là của MÁY CHỦ (không tải được ảnh,
            # thiếu file mô hình), không phải dữ liệu của studio — nên nó qua được
            # hàng rào riêng tư ở trên.
            jq -r '"  ok · quét \([.reports[]?.scanned // 0]|add // 0) ảnh"
                 + " · xác nhận \([.reports[]?.daXacNhan // 0]|add // 0) mốc"
                 + " · gom \([.reports[]?.clustered // 0]|add // 0) người"
                 + " · lỗi tải \([.reports[]?.failed // 0]|add // 0)"
                 + " · hàng đợi \(.daNhinThay.canQuet|length) quét / \(.daNhinThay.canGom|length) gom"
                 + (if ([.reports[]?.stoppedBy]|index("ghi-khong-an"))
                    then "  ⚠ CÓ ALBUM GHI KHÔNG ĂN — xem /api/face-status" else "" end)
                 + (if ([.reports[]?.stoppedBy]|index("tai-quet-loi"))
                    then "  ⚠ ALBUM TẮC: quét 0 tấm mà toàn lỗi" else "" end)
                 + ([.reports[]?.loiMau | select(.)] | if length > 0 then "  · lỗi mẫu: \(.[0])" else "" end)' /tmp/ra.json
            # Dừng sớm CHỈ khi thật sự không còn gì. Bản trước dò chuỗi
            # `"reports":[]` bằng grep, và chuỗi đó nói dối ở hai hình dạng thân
            # KHÔNG có khoá `reports`: lượt hỏng (đã chặn bằng mã HTTP ở trên) và
            # lượt FACE_SCAN_OFF=1 — cái sau khiến workflow gọi tiếp bảy lượt nữa
            # vào một bộ quét đang tắt. Hỏi jq đúng câu thì cả hai hết chỗ trốn.
            trang_thai=$(jq -r 'if .tat then "tat" elif (.reports|length) == 0 then "het" else "con" end' /tmp/ra.json)
            if [ "${trang_thai}" = "tat" ]; then
              echo "Bộ quét đang TẮT (FACE_SCAN_OFF=1) — không gọi thêm lượt nào."
              exit 0
            fi
            if [ "${trang_thai}" = "het" ]; then
              echo "Không còn gì để quét — dừng sớm."
              break
            fi
            sleep 3
          done
