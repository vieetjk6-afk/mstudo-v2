name: Deploy production (Vercel)

# Deploy bản production lên Vercel bằng Vercel CLI.
#  - Tự chạy mỗi khi có commit mới trên nhánh main.
#  - Chạy tay: tab Actions → "Deploy production (Vercel)" → Run workflow.
#
# Dùng đường này khi Vercel GitHub App CHƯA được cài cho org — không có app thì
# GitHub không gửi sự kiện push cho Vercel, push main bao nhiêu lần cũng không
# tự build. Workflow này gọi thẳng Vercel CLI nên không cần app.
#
# Cần 3 secret trong repo (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       vercel.com/account/tokens → Create Token
#   VERCEL_ORG_ID      Vercel → Settings (của account/team) → ID  (dạng team_… hoặc user id)
#   VERCEL_PROJECT_ID  Vercel → project mstudo-v2 → Settings → General → Project ID (prj_…)
# Chưa thêm secret thì workflow tự bỏ qua (báo warning, không đỏ).
#
# Hai chốt an toàn trước khi bản mới lên (xem docs/trien-khai-tu-dong.md):
#   1. KIỂM THỬ: chạy cả bộ `npm test`; có bài đỏ thì không deploy.
#   2. TỰ CHẠY SQL: supabase/cap-nhat.sql đổi thì tự chạy lên database trước khi
#      deploy (cần thêm secret SUPABASE_DB_URL; chưa có thì bỏ qua bước này, và
#      SQL vẫn phải dán tay như trước). SQL hỏng thì rollback và không deploy.
# Khi cần lên gấp, chạy tay workflow này và tích ô bỏ qua tương ứng.
#
# Biến môi trường của build (Supabase, Drive, Zalo…) KHÔNG lấy từ đây — `vercel
# pull` tải nguyên bộ Environment Variables của project trên Vercel về, đúng như
# khi Vercel tự build.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bo_qua_kiem_thu:
        description: Bỏ qua kiểm thử (chỉ khi cần lên gấp)
        type: boolean
        default: false
      bo_qua_sql:
        description: Không tự chạy SQL lượt này
        type: boolean
        default: false

permissions:
  contents: read

# Nhiều commit đẩy liên tiếp thì chỉ deploy commit mới nhất.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  kiem-thu:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bo_qua_kiem_thu) }}
    uses: ./.github/workflows/kiem-thu.yml
    with:
      chi_kiem_thu: true

  deploy:
    needs: kiem-thu
    # Kiểm thử đạt, hoặc được chủ động bỏ qua. Hỏng / bị huỷ thì không deploy.
    if: ${{ always() && (needs.kiem-thu.result == 'success' || needs.kiem-thu.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Kiểm tra secret
        id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa đủ secret (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) — bỏ qua deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Cài Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài Vercel CLI
        if: steps.check.outputs.skip != 'true'
        run: npm install --global vercel@latest

      - name: Tải cấu hình + biến môi trường production
        id: pull
        if: steps.check.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # `vercel pull` hỏng gần như luôn là do BỘ BA token / ORG_ID / PROJECT_ID
      # không khớp nhau (hay gặp nhất: token tạo ở tài khoản cá nhân nhưng
      # project nằm trong team). Liệt kê những gì token NHÌN THẤY để biết phải
      # sửa ID nào — tên team/project không phải bí mật, ID vẫn được che.
      - name: Chẩn đoán khi không tải được cấu hình
        if: failure() && steps.pull.outcome == 'failure'
        run: |
          echo "── Token này thuộc tài khoản: ─────────────────────────────"
          vercel whoami --token="${{ secrets.VERCEL_TOKEN }}" || true
          echo "── Các team token nhìn thấy: ──────────────────────────────"
          vercel teams ls --token="${{ secrets.VERCEL_TOKEN }}" || true
          echo "── Các project token nhìn thấy (trong scope hiện tại): ────"
          vercel project ls --token="${{ secrets.VERCEL_TOKEN }}" || true
          echo ""
          echo "Nếu project cần deploy KHÔNG có trong danh sách trên thì token"
          echo "sai scope: tạo lại token và chọn đúng team chứa project, hoặc"
          echo "sửa VERCEL_ORG_ID / VERCEL_PROJECT_ID cho khớp (Vercel →"
          echo "project → Settings → General → Project ID / Team ID)."

      # Biến NEXT_PUBLIC_* bị nướng cứng vào bundle lúc build, nên một giá trị
      # gõ sai vẫn build thành công rồi mới nổ ở trình duyệt ("Invalid
      # supabaseUrl…") mà log build không hé một chữ. Soi trước, in nguyên văn
      # giá trị công khai, và dừng luôn nếu sai — đỡ deploy ra một site hỏng.
      - name: Soi biến môi trường trước khi build
        if: steps.check.outputs.skip != 'true'
        run: node scripts/kiem-tra-bien.mjs

      - name: Build
        if: steps.check.outputs.skip != 'true'
        env:
          # Next chạy bước "checking validity of types" trong worker riêng, và
          # Node chỉ cấp ~2GB heap theo mặc định. Repo này đủ lớn để vượt mức đó
          # → build chết "JavaScript heap out of memory" ngay sau khi compile
          # xong. Máy chạy của GitHub có 16GB nên cấp 6GB là thoải mái.
          NODE_OPTIONS: --max-old-space-size=6144
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Chạy SAU khi build xong (build hỏng thì chưa đụng database) và TRƯỚC khi
      # bản mới lên: code mới luôn gặp database đã có đủ bảng / cột của nó. SQL
      # trong cap-nhat.sql được viết theo lối thêm vào / chạy lại được nên bản cũ
      # đang chạy vẫn dùng được trong vài chục giây chờ deploy.
      - name: Tự chạy SQL (supabase/cap-nhat.sql)
        if: ${{ steps.check.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.bo_qua_sql) }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::Chưa có secret SUPABASE_DB_URL — không tự chạy SQL. Nếu bản này có SQL mới thì vẫn phải dán supabase/cap-nhat.sql vào SQL Editor như trước (xem docs/trien-khai-tu-dong.md)."
          fi
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          node scripts/chay-sql.mjs

      - name: Deploy (gán vào domain production)
        if: steps.check.outputs.skip != 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "$url"
          echo "### Đã deploy production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
